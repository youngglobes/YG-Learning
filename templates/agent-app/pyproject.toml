[project]
name = "agent-app"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.3",
    "langgraph>=1.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
claude = ["langchain-anthropic>=1.5"]
ollama = ["langchain-ollama>=1.0"]
rag    = ["langchain-huggingface", "sentence-transformers", "langchain-text-splitters", "numpy"]
sqlite = ["langgraph-checkpoint-sqlite"]
dev    = ["pytest>=8.0", "ruff"]

[project.scripts]
agent = "agent_app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
