name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  template-tests:
    name: Agent template tests (no API key)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install template
        working-directory: templates/agent-app
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        working-directory: templates/agent-app
        # Deliberately no ANTHROPIC_API_KEY and no Ollama. The template's
        # tests use a fake model and must never require either.
        run: pytest -q

  docs-links:
    name: Internal doc links resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_links.py
